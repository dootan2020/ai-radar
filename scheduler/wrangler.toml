name = "ai-radar-scheduler"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Cadence:
# - update.yml: every 20 minutes (*/20 * * * *) -> 72 executions/day
# - shadow-collector.yml: once an hour at minute 5 (5 * * * *) -> 24 executions/day
#
# 1. Guarantees news freshness under 30 minutes as promised, even during GitHub cron outages.
# 2. Provides 10-15 minutes of idle time between workflow runs, preventing runner queue congestion.
# 3. Collector runs at minute 5, completely non-overlapping with update dispatch (0, 20, 40),
#    GitHub update fallback cron (7, 37), and GitHub shadow cron (17).
# 4. Total executions: 72 + 24 = 96 executions/day, consuming ~0.096% of Cloudflare Free plan (100,000 requests/day).
[triggers]
crons = ["*/20 * * * *", "5 * * * *"]

[vars]
GITHUB_OWNER = "dootan2020"
GITHUB_REPO = "ai-radar"
GITHUB_WORKFLOW = "update.yml"
GITHUB_SHADOW_WORKFLOW = "shadow-collector.yml"
GITHUB_REF = "main"
