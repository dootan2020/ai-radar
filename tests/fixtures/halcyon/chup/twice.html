<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Twice</title><style>body{margin:0;padding:20px 16px;font:18px/1.5 Georgia,serif;color:#111;background:#fff}h1{font:700 26px/1.2 Arial,sans-serif;margin:0 0 14px}p{margin:0 0 16px}.by{font:14px Arial;color:#555}</style></head><body><h1>Said twice</h1><p>First time: the board will meet on Monday morning to decide. That is all we know so far about the plan.</p><p>Second time, in another paragraph: the board will meet on Monday morning to decide. And then it will tell everyone.</p></body></html>
