name: Shadow Collector (Nguon bong)

on:
  schedule:
    # Run once per hour at minute 17 (avoids top-of-hour contention)
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Candidate ID to collect (optional; leave blank to collect all)'
        required: false
        default: ''
      kind:
        description: 'Kind filter (optional: "fixed feed", "query", "signal")'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run Shadow Collector
        env:
          CANDIDATE_ID: ${{ github.event.inputs.candidate_id }}
          CANDIDATE_KIND: ${{ github.event.inputs.kind }}
        run: |
          if [ -n "$CANDIDATE_ID" ] && [ -n "$CANDIDATE_KIND" ]; then
            python -m radar.shadow_collector --summary --output-json shadow-records.json --output-jsonl shadow-records.jsonl --output-summary shadow-summary.md --id "$CANDIDATE_ID" --kind "$CANDIDATE_KIND"
          elif [ -n "$CANDIDATE_ID" ]; then
            python -m radar.shadow_collector --summary --output-json shadow-records.json --output-jsonl shadow-records.jsonl --output-summary shadow-summary.md --id "$CANDIDATE_ID"
          elif [ -n "$CANDIDATE_KIND" ]; then
            python -m radar.shadow_collector --summary --output-json shadow-records.json --output-jsonl shadow-records.jsonl --output-summary shadow-summary.md --kind "$CANDIDATE_KIND"
          else
            python -m radar.shadow_collector --summary --output-json shadow-records.json --output-jsonl shadow-records.jsonl --output-summary shadow-summary.md
          fi
      - name: Upload Shadow Collector Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-collector-records
          path: |
            shadow-records.json
            shadow-records.jsonl
            shadow-summary.md
          retention-days: 14
          if-no-files-found: warn
