name: Monitor live AI Radar

on:
  schedule:
    - cron: '13,28,43,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-live-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    permissions:
      contents: read
      issues: write
    steps:
      # Manual branch selection must not execute unreviewed code with issue access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Probe live site and reconcile health incident
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m radar.health_monitor --report
