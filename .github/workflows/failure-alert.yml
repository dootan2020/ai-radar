name: Report update failures

on:
  workflow_run:
    workflows: [Update AI Radar]
    types: [completed]

permissions:
  contents: read

# Serialize failures and recovery for the same branch; the reporter checks run order.
concurrency:
  group: radar-failure-alert-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  alert:
    if: >-
      contains(fromJSON('["failure", "timed_out", "action_required", "startup_failure", "success"]'), github.event.workflow_run.conclusion)
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # Never execute the triggering branch or code from downloaded artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download publish diagnostics
        if: github.event.workflow_run.conclusion != 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: radar-publish-status-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/radar-publish-diagnostics
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reconcile update failure issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_PUBLISH_STATUS: ${{ runner.temp }}/radar-publish-diagnostics/publish-status.json
        run: python -m radar.failure_alert
