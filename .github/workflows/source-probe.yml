name: Candidate Source Probe

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Candidate ID to probe (optional; leave blank to probe all 35 candidates)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run Candidate Source Probe
        env:
          CANDIDATE_ID: ${{ github.event.inputs.candidate_id }}
        run: |
          if [ -n "$CANDIDATE_ID" ]; then
            python -m radar.source_probe --summary --output source-probe-results.md --json-output source-probe-results.json --id "$CANDIDATE_ID"
          else
            python -m radar.source_probe --summary --output source-probe-results.md --json-output source-probe-results.json
          fi
      - name: Upload Probe Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-probe-results
          path: |
            source-probe-results.md
            source-probe-results.json
          if-no-files-found: warn
