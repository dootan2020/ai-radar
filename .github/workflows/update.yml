name: Update AI Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    # Allow collection, translation and artifact headroom plus five minutes for bounded optional archive work.
    timeout-minutes: 30
    outputs:
      edition_candidate: ${{ steps.edition-upload.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-translate.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests
      - name: Restore previous measurement snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/measurement-baseline.json
          key: radar-measurements-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-measurements-v2-${{ github.ref_name }}-
            radar-measurements-v2-main-
      - name: Restore last published snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/published-snapshot.json
          key: radar-publication-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-publication-v1-main-
      - name: Fetch public sources
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py
      - name: Save measurement snapshot
        if: steps.collect.outputs.baseline_updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/measurement-baseline.json
          key: radar-measurements-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Headline translation is optional: every step below may fail and the page still ships with original titles.
      - name: Install translation libraries
        id: mt-install
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check -r requirements-translate.txt
      - name: Restore translation model
        id: mt-model
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf-home
          key: mt-nllb-200-distilled-600M-a3e77be-v1
      - name: Restore translation cache
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/translations-vi.json
          key: radar-translations-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-translations-v1-${{ github.ref_name }}-
            radar-translations-v1-main-
      - name: Translate headlines
        id: translate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TRANSFORMERS_VERBOSITY: error
          RADAR_TRANSLATE_BUDGET: '600'
        run: python -m radar.translate --input site/data/radar.json --cache data/translations-vi.json
      - name: Save translation model
        if: always() && steps.mt-model.outputs.cache-hit != 'true' && steps.translate.outputs.model_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf-home
          key: mt-nllb-200-distilled-600M-a3e77be-v1
      - name: Save translation cache
        if: always() && steps.translate.outputs.cache_written == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/translations-vi.json
          key: radar-translations-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Editions capture translated titles only after a matching successful publication gate.
      - name: Prepare daily editions
        id: edition-prepare
        if: steps.collect.outputs.published == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.edition_publish prepare --remote "$EDITION_REMOTE"
      - name: Upload edition history candidate
        id: edition-upload
        if: github.ref == 'refs/heads/main' && steps.edition-prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-editions-${{ github.run_id }}
          path: data/edition-candidate
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload collected source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/data/radar.json
      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-publish-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/publish-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload publication candidate
        if: github.ref == 'refs/heads/main' && steps.collect.outputs.published_snapshot_updated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-publication-${{ github.run_id }}
          path: data/published-snapshot.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  persist:
    if: github.ref == 'refs/heads/main' && needs.update.result == 'success' && needs.update.outputs.edition_candidate == 'success'
    needs: update
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download edition history candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-editions-${{ github.run_id }}
          path: data/edition-candidate
      - name: Persist edition history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.edition_publish persist --remote "$EDITION_REMOTE"
  deploy:
    if: github.ref == 'refs/heads/main' && needs.update.result == 'success'
    needs: update
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A collected candidate becomes the freshness reference only after Pages accepts it.
      - name: Download published snapshot
        id: published-snapshot
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-publication-${{ github.run_id }}
          path: data
      - name: Save published snapshot
        if: steps.deployment.outcome == 'success' && steps.published-snapshot.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/published-snapshot.json
          key: radar-publication-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
