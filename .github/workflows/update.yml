name: Update AI Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-26.04
    # Preserve the original 30-minute allowance plus 19 bounded optional field minutes.
    timeout-minutes: 49
    outputs:
      edition_candidate: ${{ steps.edition-upload.outcome }}
      field_candidate: ${{ steps.field-upload.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-translate.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests
      - name: Restore previous measurement snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/measurement-baseline.json
          key: radar-measurements-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-measurements-v2-${{ github.ref_name }}-
            radar-measurements-v2-main-
      - name: Restore last published snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/published-snapshot.json
          key: radar-publication-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-publication-v1-main-
      - name: Restore image cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/image-cache.json
          key: radar-image-cache-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-image-cache-v1-${{ github.ref_name }}-
            radar-image-cache-v1-main-
      - name: Fetch public sources
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py
      - name: Save measurement snapshot
        if: steps.collect.outputs.baseline_updated == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/measurement-baseline.json
          key: radar-measurements-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save image cache
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/image-cache.json
          key: radar-image-cache-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Translation is optional: failed steps leave original titles and summaries usable.
      - name: Install translation libraries
        id: mt-install
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        run: python -m pip install --disable-pip-version-check -r requirements-translate.txt
      - name: Restore translation model
        id: mt-model
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf-home
          key: mt-nllb-200-distilled-600M-a3e77be-v1
      - name: Restore translation cache
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/translations-vi.json
          key: radar-translations-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-translations-v1-${{ github.ref_name }}-
            radar-translations-v1-main-
      - name: Restore Gemini translation cache and attempt ledger
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/translations-gemini-vi.json
            data/translation-gemini-attempts.json
          key: radar-gemini-vi-1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-gemini-vi-1-${{ github.ref_name }}-
            radar-gemini-vi-1-main-
      - name: Translate headlines
        id: translate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        env:
          HF_HOME: ${{ runner.temp }}/hf-home
          HF_HUB_DISABLE_TELEMETRY: '1'
          HF_HUB_DISABLE_PROGRESS_BARS: '1'
          TRANSFORMERS_VERBOSITY: error
          RADAR_TRANSLATE_BUDGET: '600'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_GEMINI_FREE_TIER_CONFIRMED: ${{ vars.RADAR_GEMINI_FREE_TIER_CONFIRMED }}
        run: python -m radar.translate --input site/data/radar.json --cache data/translations-vi.json
      - name: Save translation model
        if: always() && steps.mt-model.outputs.cache-hit != 'true' && steps.translate.outputs.model_ready == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hf-home
          key: mt-nllb-200-distilled-600M-a3e77be-v1
      - name: Save translation cache
        if: always() && steps.translate.outputs.cache_written == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/translations-vi.json
          key: radar-translations-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save Gemini translation cache and attempt ledger
        if: always() && (steps.translate.outputs.gemini_cache_written == 'true' || steps.translate.outputs.gemini_ledger_written == 'true')
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/translations-gemini-vi.json
            data/translation-gemini-attempts.json
          key: radar-gemini-vi-1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Editions capture translated titles only after a matching successful publication gate.
      - name: Prepare daily editions
        id: edition-prepare
        if: steps.collect.outputs.published == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.edition_publish prepare --remote "$EDITION_REMOTE"
      - name: Upload edition history candidate
        id: edition-upload
        if: github.ref == 'refs/heads/main' && steps.edition-prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-editions-${{ github.run_id }}
          path: data/edition-candidate
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      # Field failures never participate in the news publication quorum.
      # The attempt cache is independent of the data branch: failed Git pushes
      # must not cause another full collection on every fresh half-hour runner.
      - name: Restore last good field output
        id: field-fallback-cache
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/field-last-good.json
          key: radar-field-output-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-field-output-v2-${{ github.ref_name }}-
            radar-field-output-v2-main-
      - name: Retain validated field output before preparation
        id: field-retain
        continue-on-error: true
        timeout-minutes: 1
        run: python -m radar.field_checkpoint restore
      - name: Prepare field attempt checkpoint
        id: field-slot
        continue-on-error: true
        timeout-minutes: 1
        run: python -m radar.field_checkpoint reserve
      - name: Check field attempt checkpoint
        id: field-attempt-restore
        if: steps.field-slot.outcome == 'success' && steps.field-fallback-cache.outcome == 'success' && steps.field-retain.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/field-attempt.json
          key: radar-field-attempt-v2-${{ github.ref_name }}-${{ steps.field-slot.outputs.slot }}
          lookup-only: true
      - name: Reserve field attempt checkpoint
        id: field-attempt-save
        if: steps.field-attempt-restore.outcome == 'success' && steps.field-attempt-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/field-attempt.json
          key: radar-field-attempt-v2-${{ github.ref_name }}-${{ steps.field-slot.outputs.slot }}
      # cache/save can warn instead of failing. A successful outcome alone is
      # insufficient proof: restore the exact key and verify this attempt owns it.
      - name: Clear local field checkpoint before read-back
        id: field-attempt-clear
        if: steps.field-attempt-save.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        run: python -m radar.field_checkpoint clear
      - name: Verify field attempt checkpoint
        id: field-attempt-verify
        if: steps.field-attempt-clear.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/field-attempt.json
          key: radar-field-attempt-v2-${{ github.ref_name }}-${{ steps.field-slot.outputs.slot }}
      - name: Verify ownership of restored field checkpoint
        id: field-attempt-own
        if: steps.field-attempt-verify.outcome == 'success' && steps.field-attempt-verify.outputs.cache-hit == 'true'
        continue-on-error: true
        timeout-minutes: 1
        run: python -m radar.field_checkpoint verify --claim "${{ steps.field-slot.outputs.claim }}" --slot "${{ steps.field-slot.outputs.slot }}"
      - name: Prepare repository field rankings
        id: field-prepare
        if: steps.field-attempt-own.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIELD_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.field_publish prepare --remote "$FIELD_REMOTE"
      - name: Save last good field output
        id: field-output-save
        if: always() && (steps.field-prepare.outcome == 'success' || steps.field-prepare.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/field-last-good.json
          key: radar-field-output-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload field history candidate
        id: field-upload
        if: github.ref == 'refs/heads/main' && steps.field-prepare.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-fields-${{ github.run_id }}
          path: data/field-candidate
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload field diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-field-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/data/field-rankings.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload collected source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/data/radar.json
      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-publish-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/publish-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload publication candidate
        if: github.ref == 'refs/heads/main' && steps.collect.outputs.published_snapshot_updated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: radar-publication-${{ github.run_id }}
          path: data/published-snapshot.json
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  persist:
    if: github.ref == 'refs/heads/main' && needs.update.result == 'success' && needs.update.outputs.edition_candidate == 'success'
    needs: update
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download edition history candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-editions-${{ github.run_id }}
          path: data/edition-candidate
      - name: Persist edition history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDITION_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.edition_publish persist --remote "$EDITION_REMOTE"
  persist-fields:
    if: github.ref == 'refs/heads/main' && needs.update.result == 'success' && needs.update.outputs.field_candidate == 'success'
    needs: update
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Download field history candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-fields-${{ github.run_id }}
          path: data/field-candidate
      - name: Persist field history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIELD_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: python -m radar.field_publish persist --remote "$FIELD_REMOTE"
  deploy:
    if: github.ref == 'refs/heads/main' && needs.update.result == 'success'
    needs: update
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A collected candidate becomes the freshness reference only after Pages accepts it.
      - name: Download published snapshot
        id: published-snapshot
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: radar-publication-${{ github.run_id }}
          path: data
      - name: Save published snapshot
        if: steps.deployment.outcome == 'success' && steps.published-snapshot.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/published-snapshot.json
          key: radar-publication-v1-main-${{ github.run_id }}-${{ github.run_attempt }}
