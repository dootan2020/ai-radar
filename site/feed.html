<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ai·radar · Khám phá (bản thử nghiệm)</title>
<meta name="description" content="ai-radar Khám phá: dòng tin AI phẳng, nhiều ảnh, kiểu trang khởi động Edge và Google Discover. Ảnh do chính nguồn công bố, xen kẽ ô phát sóng, đang nóng, kho mã và mô hình.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32">
<!-- Prototype feed page, flat round (04/10). Static, no CDN, no dependency. Every photo is published by the source
     itself (plans/nhap/fetch_images.py writes feed-images.json); a story without one gets a flat cover drawn from its
     own data. One function in feed.js, pickImage(), decides every picture.
     "Đáng đọc" round (04/10 21:35): a ranked block of 3 to 5 stories on top, a reason label per card, a sort switch.
     The score uses only fields of the feed; its weights sit in one constant in feed.js (WORTH). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://dootan2020.github.io https://huggingface.co; object-src 'none'; base-uri 'self'; form-action 'none';">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="feed.css">
<script type="module" src="feed.js"></script>
</head>
<body>
<a class="skip" href="#feed-main">Bỏ qua tới nội dung</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 5h10v10M19 5L6 18"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A7.5 7.5 0 0 1 9.5 4.5a7.5 7.5 0 1 0 10 10z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M9 7.2v9.6a.6.6 0 0 0 .9.5l7.6-4.8a.6.6 0 0 0 0-1L9.9 6.7a.6.6 0 0 0-.9.5z"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M18 20l-6-4.3L6 20V5.5A1.5 1.5 0 0 1 7.5 4h9A1.5 1.5 0 0 1 18 5.5z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v13M6.5 12.5L12 18l5.5-5.5"/></symbol>
</svg>

<header class="feed-bar">
  <div class="feed-bar-in">
    <a class="feed-brand" href="index.html" aria-label="ai radar, về trang chính">ai<b>·</b>radar</a>
    <div class="feed-filters" id="feed-filters" role="group" aria-label="Lọc dòng tin">
      <button class="filter-chip" data-filter="all" aria-pressed="true">Tất cả</button>
      <button class="filter-chip" data-filter="big" aria-pressed="false">Chuyện lớn</button>
      <button class="filter-chip" data-filter="hot" aria-pressed="false">Đang nóng</button>
      <button class="filter-chip" data-filter="product" aria-pressed="false">Sản phẩm</button>
      <button class="filter-chip" data-filter="forum" aria-pressed="false">Thảo luận</button>
      <button class="filter-chip" data-filter="code" aria-pressed="false">Mã và mô hình</button>
    </div>
    <button class="theme-btn" id="theme-btn" aria-pressed="false" aria-label="Chuyển chế độ sáng hoặc tối">
      <svg class="i i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="i i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main class="feed-main" id="feed-main" tabindex="-1" aria-busy="true">
  <div class="feed-head">
    <h1 class="feed-h1" id="feed-h1">Khám phá</h1>
    <p class="feed-sub" id="feed-sub" aria-live="polite">Đang nạp dòng tin…</p>
    <div class="new-items" id="new-items" hidden>
      <svg class="i" aria-hidden="true"><use href="#i-down"/></svg>
      <span id="new-items-text"></span>
      <button class="text-btn" id="mark-seen-btn">Đánh dấu đã xem</button>
    </div>
    <div class="sort-switch" id="sort-switch" role="group" aria-label="Thứ tự dòng tin" hidden>
      <button class="sort-btn" data-sort="worth" aria-pressed="true">Đáng đọc nhất</button>
      <button class="sort-btn" data-sort="new" aria-pressed="false">Mới nhất</button>
    </div>
  </div>

  <!-- "Đáng đọc hôm nay": 3 to 5 stories ranked by measured signals (feed.js, WORTH), each with its reason in numbers.
       Only entries of editor-picks.json may carry "Biên tập chọn"; everything else here is computed. -->
  <section class="picks" id="picks" aria-labelledby="picks-h" hidden>
    <div class="picks-head">
      <h2 class="picks-title" id="picks-h">Đáng đọc hôm nay</h2>
      <p class="picks-note" id="picks-note"></p>
      <button class="text-btn how-btn" id="how-btn" aria-expanded="false" aria-controls="how-panel">Cách chấm</button>
    </div>
    <div class="how-panel" id="how-panel" hidden></div>
    <div class="picks-grid" id="picks-grid"></div>
  </section>

  <section class="feed-grid" id="feed-grid" aria-label="Dòng tin">
    <div class="sk-card sk-lead"><div class="sk"></div></div>
    <div class="sk-card"><div class="sk sk-media"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
    <div class="sk-card sk-tall"><div class="sk sk-media"></div><div class="sk sk-line"></div></div>
    <div class="sk-card"><div class="sk sk-media"></div><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
    <p class="sr" role="status">Đang tải dòng tin…</p>
  </section>

  <div class="feed-more" id="feed-more" hidden>
    <button class="btn" id="more-btn">Xem thêm</button>
  </div>

  <div class="feed-empty" id="feed-empty" hidden>
    <h2>Không có tin nào trong bộ lọc này</h2>
    <p>Trong 72 giờ qua chưa có tin thuộc nhóm này. Chọn nhóm khác hoặc xem tất cả.</p>
    <button class="btn primary" id="reset-filter-btn">Xem tất cả</button>
  </div>

  <footer class="feed-end" id="feed-end" hidden>
    <h2>Bạn đã xem hết dòng tin</h2>
    <p id="feed-end-stats"></p>
    <div class="end-actions">
      <button class="btn primary" id="mark-all-btn">Đánh dấu đã xem hết</button>
      <a class="btn" href="#feed-main"><svg class="i" aria-hidden="true"><use href="#i-up"/></svg>Lên đầu trang</a>
      <a class="btn ghost" href="index.html">Về trang chính</a>
    </div>
  </footer>
</main>

<div class="toast-container" id="toast-container" aria-live="polite"></div>
</body>
</html>
