<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}} · Halcyon</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="robots" content="max-image-preview:large">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Halcyon">
<meta property="og:locale" content="vi_VN">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
{{IMAGE_META}}
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<link rel="icon" href="../../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<script>{{THEME_SCRIPT}}</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../feed.css">
<link rel="stylesheet" href="../../story.css">
<link rel="stylesheet" href="../../trang-phu.css">
<link rel="stylesheet" href="../../menu-cong-cu.css">
<script type="application/json" id="story-data">{{STORY_DATA}}</script>
<script type="application/ld+json">{{JSONLD}}</script>
<script type="module" src="../../story-page.js"></script>
<script type="module" src="../../trang-phu.js"></script>
<script defer src="../../menu-cong-cu.js"></script>
</head>
<body>
<a class="skip" href="#story-root">Bỏ qua tới nội dung bài viết</a>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 5h10v10M19 5L6 18"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M18 20l-6-4.3L6 20V5.5A1.5 1.5 0 0 1 7.5 4h9A1.5 1.5 0 0 1 18 5.5z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
</svg>
<!-- The front page's shell (site/trang-phu.css; captain 16/11, decision 1): "Tùy chỉnh" and the Google apps in the top row,
     the Coral Tile and "halcyon" in the panel's header row, the story in one card on the panel. -->
<header class="masthead phu-top" id="masthead">
  <div class="phu-top-in">
    <div class="masthead-actions">
      <button class="top-tile" id="phu-tc" type="button" aria-label="Tùy chỉnh" title="Tùy chỉnh" aria-expanded="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
      <div class="tool-launcher"></div>
    </div>
  </div>
</header>
<div class="phu-panel" id="top">
<nav class="phu-head" id="bar" aria-label="Halcyon">
  <a class="brand" href="../../index.html" aria-label="Halcyon, về trang nhất"><img class="brand-tile" src="../../logo.svg" width="34" height="34" alt=""><span class="brand-name" aria-hidden="true">halcyon</span></a>
  <div class="phu-sections"><a class="phu-chip" href="../../index.html" id="doc-back-btn">Trang nhất</a></div>
  <div class="head-actions">
    <a class="ed-link" href="../../ban-tin.html"><span>Bản tin sáng</span><svg class="i" aria-hidden="true"><use href="#i-out"/></svg></a>
  </div>
</nav>
<main class="story-page-container phu-card" id="story-root">
  <article class="story-article" data-id="{{STORY_ID}}">
    <header class="story-header">
      <div class="story-meta-row"><div class="story-pub-info">{{PUBLISHER}}</div></div>
      <h1 class="story-headline" id="story-modal-title">{{TITLE}}</h1>
      <div class="story-orig-block"><p class="card-orig"><span class="orig-text">{{ORIGINAL_TITLE}}</span></p></div>
    </header>
    {{CONTENT}}
    <section class="story-origin-gateway" aria-label="Chuyển đến bài viết gốc">
      <div class="story-origin-info"><span class="story-origin-eyebrow">Toàn văn bài viết</span>
        <h3 class="story-origin-title">Đọc bài viết đầy đủ trên {{PUBLISHER_NAME}}</h3>
        <p class="story-origin-desc">{{GATEWAY_DESC}}</p>
      </div>
      <a class="btn primary story-origin-btn" href="{{ORIGINAL_URL}}" target="_blank" rel="noopener noreferrer"><span>Mở bài viết gốc</span><svg class="i" aria-hidden="true"><use href="#i-out"/></svg></a>
    </section>
  </article>
</main>
</div>
<div class="toast-container" id="toast-container" aria-live="polite"></div>
</body>
</html>
