id = "agy"
capabilities = ["tim-kiem", "doc-bai", "bien-tap", "kiem-chung"]
kind = "subscription-boat"
cost_class = "subscription"
priority = 20
monthly_cap_usd = 0
boat = "agy"
runner = "batch-cli"
argv = ["agy", "-p", "{prompt}", "--model", "gemini-3.8-flash-high", "--output-format", "json"]
prompt_transport = "argument"
[detect]
command = "agy"
# Owner 2026-10-28: Codex is near its weekly limit and reserved for content review, so every desk runs agy first;
# Codex (priority 10) stays the fallback. The checker still excludes the editor's boat, so it uses Codex when the editor ran on agy.
[desk_priority]
reporter = 5
editor = 5
checker = 5
writer = 5
